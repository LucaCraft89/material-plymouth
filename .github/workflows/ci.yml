name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
    inputs:
      material_grub_ref:
        description: "material-grub branch, tag or commit to test against (empty: the default below)"
        required: false
        default: ""
permissions: {contents: read}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # This part plugs into material-grub (its plugin API and the shared conf keys). The ref it is tested against: the run's input, else the repository
  # variable MATERIAL_GRUB_REF, else the branch that has the plugin API until it is merged into material-grub's release/0.8.0 (then change it to that,
  # and to a tag once there is one).
  MATERIAL_GRUB_REF: ${{ inputs.material_grub_ref || vars.MATERIAL_GRUB_REF || 'feat/plymouth-contract' }}

jobs:
  lint:
    name: Lint (ruff, shellcheck, actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install ruff && pipx install shellcheck-py && pipx install actionlint-py
      - run: ruff check .
      - run: ruff format --check .
      - run: shellcheck -x --severity=warning ci/*.sh
      - run: actionlint

  unit:
    name: Unit tests (Python ${{ matrix.python }})
    # Python 3.8 is the oldest Python the material-grub tools run on (RHEL 8 family), 3.13 the newest in use. Pinned to 24.04: `ubuntu-latest` is 26.04
    # now, which has no Python 3.8 for setup-python.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LucaCraft89/material-grub
          ref: ${{ env.MATERIAL_GRUB_REF }}
          path: material-grub
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install pillow pyyaml
      - run: python -m unittest discover -s tests -v
        env:
          MATERIAL_GRUB: ${{ github.workspace }}/material-grub
          REQUIRE_CONTRACT: "1"      # a missing or incompatible material-grub is a failure here, not a skip

  consistency:
    # Tier 1 of the plan, the part that needs material-grub's built package: the Plymouth scene's pictures are pixel-identical to GRUB's own drawing,
    # and every customisation (colours, one seed colour, names, icons, COOKIE, LOGO, sizes) reaches them. Builds the package from the material-grub ref
    # (about a minute); REQUIRE_CORE makes a missing package a failure here instead of a skip.
    name: Consistency with GRUB (built package)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LucaCraft89/material-grub
          ref: ${{ env.MATERIAL_GRUB_REF }}
          path: material-grub
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil librsvg2-bin grub-common
      - name: Build material-grub's package (sources only, like its own CI)
        working-directory: material-grub
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --require-hashes -r requirements.txt
          .venv/bin/python scripts/package.py --res 1920x1080
      - run: material-grub/.venv/bin/pip install pyyaml
      - run: material-grub/.venv/bin/python -m unittest discover -s tests -v
        env:
          MATERIAL_GRUB: ${{ github.workspace }}/material-grub
          REQUIRE_CONTRACT: "1"
          REQUIRE_CORE: "1"

  xvfb:
    # Tier 2 of the plan: the theme in real Plymouth (the X11 renderer under Xvfb). First the harness on a stock animated theme, then the Material theme
    # itself in every style and motion level: it draws, it moves (or stands still when told), every customisation reaches the pixels, the disk-password
    # prompt takes input and shows it, shutdown mode shows its message. Screenshots are an artifact.
    name: Plymouth in Xvfb (the theme and the harness)
    # Pinned to 24.04 (Plymouth 24.004, the version the Phase 0 spike was measured on); a run on a newer Plymouth (Arch and Fedora have 26.x) is a
    # separate job to add.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LucaCraft89/material-grub
          ref: ${{ env.MATERIAL_GRUB_REF }}
          path: material-grub
      - run: sudo apt-get update
      - run: sudo env INITRD=No DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends plymouth plymouth-theme-spinner plymouth-x11 xvfb imagemagick bc xdotool python3-pil librsvg2-bin grub-common
      - name: Build material-grub's package (sources only, like its own CI)
        working-directory: material-grub
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --require-hashes -r requirements.txt
          .venv/bin/python scripts/package.py --res 1920x1080
      - run: ci/xvfb_play.sh spinner build/xvfb/spinner 6
      - run: python3 ci/check_frames.py --size 1920x1080 --moving build/xvfb/spinner-*.png
      - name: The Material theme, played
        run: material-grub/.venv/bin/python -m unittest discover -s tests -p "test_theme_play.py" -v
        env:
          MATERIAL_GRUB: ${{ github.workspace }}/material-grub
          REQUIRE_CORE: "1"
          REQUIRE_PLAY: "1"
          PLAY_SHOTS: ${{ github.workspace }}/build/play-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xvfb-screenshots
          path: |
            build/xvfb/
            build/play-shots/

  probe:
    # Tier 3 of the plan, first part: what Plymouth and the initramfs tooling really look like on each distro (package names, the script plugin, the
    # initramfs integration, how the default theme is chosen). The report is in the job summary and an artifact.
    name: Distro probe (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Fedora,   image: "registry.fedoraproject.org/fedora:latest"}
          - {name: Ubuntu,   image: "docker.io/library/ubuntu:24.04"}
          - {name: Debian,   image: "docker.io/library/debian:stable"}
          - {name: Arch,     image: "docker.io/library/archlinux:latest"}
          - {name: openSUSE, image: "registry.opensuse.org/opensuse/tumbleweed:latest"}
    steps:
      - uses: actions/checkout@v4
      - name: Install Plymouth in a fresh container and write down what is there
        run: |
          mkdir -p build/probe
          docker run --rm -v "$PWD:/w:ro" -v "$PWD/build/probe:/out" "${{ matrix.image }}" sh /w/ci/probe-distro.sh /out
      - name: Report
        if: always()
        run: |
          { echo "### ${{ matrix.name }}"; echo '```'; cat build/probe/*.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "probe-${{ matrix.name }}", path: build/probe/}

  initramfs:
    # Tier 3 of the plan: apply and remove against a REAL initramfs. A fresh container per distro gets Plymouth, the distro's initramfs tool (dracut,
    # initramfs-tools or mkinitcpio), a real kernel and the material-grub package; ci/initramfs_e2e.py then applies the theme, lists the image with the
    # distro's own lister (the theme, the script plugin and the pictures must be inside, the script byte-identical), applies again (--if-changed does
    # nothing), forces two failures (the tool fails; the tool writes broken images: everything must be byte-identical afterwards) and removes it again.
    name: Real initramfs (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Fedora,   image: "registry.fedoraproject.org/fedora:latest"}
          - {name: Ubuntu,   image: "docker.io/library/ubuntu:24.04"}
          - {name: Debian,   image: "docker.io/library/debian:stable"}
          - {name: Arch,     image: "docker.io/library/archlinux:latest"}
          - {name: openSUSE, image: "registry.opensuse.org/opensuse/tumbleweed:latest"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LucaCraft89/material-grub
          ref: ${{ env.MATERIAL_GRUB_REF }}
          path: material-grub
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil librsvg2-bin grub-common
      - name: Build material-grub's package
        working-directory: material-grub
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --require-hashes -r requirements.txt
          .venv/bin/python scripts/package.py --res 1920x1080
      - name: Apply and remove against a real initramfs
        run: docker run --rm -v "$PWD:/w:ro" -v "$PWD/material-grub:/mg:ro" "${{ matrix.image }}" sh /w/ci/initramfs-e2e.sh

  qemu:
    # Tier 4 of the plan: the theme in REAL Plymouth on a REAL initramfs, booted, on each distro (Plymouth 22.x on openSUSE, 24.x on Debian and Ubuntu, 26.x
    # on Fedora and Arch; dracut, initramfs-tools and mkinitcpio). ci/qemu/prepare.sh runs `plymouth apply` in a distro container (real kernel, real tool)
    # and builds a test initramfs the same way with one extra early hook; ci/qemu/boot.py boots kernel + initramfs in QEMU (KVM on the runner), drives
    # the screen through the serial port and QMP, and checks: plymouthd lives, the splash is drawn and moves, the disk-password prompt shows dots as keys are
    # typed and the typed password reaches the asker, shutdown mode shows its message. Then ci/qemu/handover.py boots the same kernel and initramfs through GRUB
    # under UEFI (OVMF) with the Material GRUB theme: the menu is themed, and after Enter the splash has the same resolution and the same colours. Screenshots are an artifact.
    name: Boot in QEMU (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Fedora,   image: "registry.fedoraproject.org/fedora:latest"}
          - {name: Ubuntu,   image: "docker.io/library/ubuntu:24.04"}
          - {name: Debian,   image: "docker.io/library/debian:stable"}
          - {name: Arch,     image: "docker.io/library/archlinux:latest"}
          - {name: openSUSE, image: "registry.opensuse.org/opensuse/tumbleweed:latest"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LucaCraft89/material-grub
          ref: ${{ env.MATERIAL_GRUB_REF }}
          path: material-grub
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil librsvg2-bin grub-common grub-efi-amd64-bin ovmf qemu-system-x86
      - name: Let QEMU use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no KVM: QEMU falls back to software emulation (slower, still works)"
      - name: Build material-grub's package
        working-directory: material-grub
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --require-hashes -r requirements.txt
          .venv/bin/python scripts/package.py --res 1280x720
      - name: Apply the theme in a ${{ matrix.name }} container and build the test initramfs
        run: |
          mkdir -p build/qemu
          docker run --rm -v "$PWD:/w:ro" -v "$PWD/material-grub:/mg:ro" -v "$PWD/build/qemu:/out" "${{ matrix.image }}" sh /w/ci/qemu/prepare.sh
      - name: Boot it and look at the screen
        run: python3 ci/qemu/boot.py build/qemu/vmlinuz build/qemu/initrd.img build/qemu/shots --timeout 900
      - name: The hand-over - GRUB (UEFI, the Material theme) boots the entry, then Plymouth takes over
        run: python3 ci/qemu/handover.py material-grub build/qemu/vmlinuz build/qemu/initrd.img build/qemu/os-release build/qemu/handover --size 1280x720 --timeout 900
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "qemu-${{ matrix.name }}-screenshots", path: "build/qemu/shots/\nbuild/qemu/handover/"}

  package:
    # Phase 6: the three package formats, built from this checkout in a distro container and exercised (ci/package-test.sh): the package holds the code, the
    # entry file, the hook and the plugin manifest where material-grub looks, and nothing prebuilt; installing it changes NOTHING about how the system
    # boots (no state, no call to material-grub); an upgrade re-applies only a theme that was applied before, with --if-changed --no-cmdline; removing it
    # takes the theme out first and leaves no file of ours. A fake material-grub records what the scriptlets call. Needs no material-grub package.
    name: Package ${{ matrix.format }} (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {format: rpm,  name: Fedora, image: "registry.fedoraproject.org/fedora:latest"}
          - {format: deb,  name: Debian, image: "docker.io/library/debian:stable"}
          - {format: arch, name: Arch,   image: "docker.io/library/archlinux:latest"}
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/w:ro" "${{ matrix.image }}" sh /w/ci/package-test.sh ${{ matrix.format }}

  ci-ok:
    # one name for branch protection to require
    name: CI passed
    needs: [lint, unit, consistency, xvfb, probe, initramfs, qemu, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "every job passed"
